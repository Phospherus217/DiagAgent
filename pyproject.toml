[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagagent"
version = "1.0.0"
description = "Failure-Aware Runtime and Evaluation Framework for Professional GUI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DiagAgent Team" }
]
keywords = ["gui-agent", "gimp", "failure-diagnosis", "benchmark", "evaluation"]
dependencies = [
    "pydantic>=2.0.0",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
desktop = [
    "pyautogui>=0.9.50",
    "PyGetWindow>=0.0.9",
    "pyperclip>=1.8",
    "psutil>=5.9",
]
test = [
    "pytest>=7.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[project.scripts]
diagagent = "diagagent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["desktop: interactive real GIMP", "model: external model requests"]
