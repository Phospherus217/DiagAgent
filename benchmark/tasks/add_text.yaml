task_id: diag_03_add_text
app: gimp
task_family: text_editing
capability: Tool Invocation
difficulty: medium
instruction: "Add Demo text"
initial_state:
  input_file: benchmark/assets/input_001.jpg
  output_file: output.png
  window_size: [1280, 720]
allowed_actions:
  - click_toolbar_icon
  - select_tool
  - add_text
  - click
  - type
  - export_file
  - wait
  - stop
subgoals:
  - id: open_image
    order: 1
    type: ui_state
    description: "Input image is loaded in GIMP canvas."
    expected_state:
      image_loaded: true
  - id: select_tool
    order: 2
    type: tool_selection
    description: "Text tool is selected from toolbox."
    expected_state:
      active_tool: text
  - id: add_text
    order: 3
    type: canvas_operation
    description: "Text 'Demo' is added to canvas with font_size=32."
    expected_action:
      action_type: [add_text]
    expected_artifact_change:
      text: Demo
      font_size: 32
  - id: export_png
    order: 4
    type: artifact
    description: "Edited image is exported as PNG."
    expected_artifact:
      exists: true
      format: png
success_criteria:
  final:
    output_exists: true
    output_format: png
    file_nonempty: true
max_steps: 12
