task_id: diag_02_crop
app: gimp
task_family: canvas_geometry
capability: Spatial Localization
difficulty: easy_medium
instruction: "Open the input image, crop the center region, and export it as PNG."
initial_state:
  input_file: benchmark/assets/input_001.jpg
  output_file: output.png
  window_size: [1280, 720]
allowed_actions:
  - click_toolbar_icon
  - drag
  - hotkey
  - crop_canvas
  - export_file
  - wait
  - stop
subgoals:
  - id: open_image
    order: 1
    type: ui_state
    description: "Input image is loaded in GIMP canvas."
    expected_state:
      image_loaded: true
  - id: crop_center
    order: 2
    type: canvas_operation
    description: "Center region is cropped on the canvas."
    expected_action:
      action_type: [crop_canvas]
  - id: export_png
    order: 3
    type: artifact
    description: "Cropped image is exported as PNG."
    expected_artifact:
      exists: true
      format: png
success_criteria:
  final:
    output_exists: true
    output_format: png
    file_nonempty: true
max_steps: 10
